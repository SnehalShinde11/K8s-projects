apiVersion: apps/v1
kind: Deployment

metadata:
  name: hpa-web-app
  labels:
    app: hpa-web-app
    created-by: snehal

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hpa-web-app

  template:
    metadata:
      labels:
        app: hpa-web-app

    spec:
      containers:
        - name: hpa-web-app
          image: snehalshinde11/kubernetes-web-app:2.0
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"

            limits:
              cpu: "500m"
              memory: "128Mi"
